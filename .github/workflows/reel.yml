name: Reels — собрать ролик
on:
  schedule:
    - cron: "0 0,1,2 * * 2,4,6"   # вт, чт, сб в 6:00, 7:00, 8:00 Бишкек (утром Google менее загружен); если ролик уже собран — пропуск; публикация в 10:00
  workflow_dispatch: {}
  push:
    paths: ["reels/request.txt"]   # пробная сборка по запросу
permissions:
  contents: write
concurrency: { group: reels, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Инструменты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy pillow
      - name: Собрать ролик
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 agent/reels/make_reel.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "aseptica-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels
          git diff --cached --quiet || git commit -m "Reels: новый ролик / отчёт"
          git pull --rebase -q || true
          git push
