name: Reels — собрать ролик
on:
  schedule:
    - cron: "0 14 * * 1,3,5"   # пн, ср, пт 20:00 Бишкек — ролик к утру вт, чт, сб
  workflow_dispatch: {}
  push:
    paths: ["reels/request.txt"]   # пробная сборка по запросу
permissions:
  contents: write
concurrency: { group: reels, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Инструменты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy pillow
      - name: Собрать ролик
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 agent/reels/make_reel.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "aseptica-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels
          git diff --cached --quiet || git commit -m "Reels: новый ролик / отчёт"
          git pull --rebase -q || true
          git push
